name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Verify lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Tests
        run: uv run pytest
      - name: Ruff
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Build package
        run: uv build
      - name: CLI smoke
        run: |
          uv run cc-enrutador --help
          uv run cc-enrutador doctor --help

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Verify lockfile
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Tests
        run: uv run pytest
      - name: Ruff
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Build package
        run: uv build
      - name: CLI smoke
        run: |
          uv run cc-enrutador --help
          uv run cc-enrutador doctor --help
