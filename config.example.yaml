# Reference configuration for cc-enrutador V1.
# Model identifiers below are examples, not mandatory bundled defaults.
# Replace them with LiteLLM-compatible models/endpoints appropriate to your environment.

server:
  host: 127.0.0.1
  port: 8787

classifier:
  mode: hybrid
  model:
    provider: litellm
    model: ollama/qwen3:4b
    api_base: http://127.0.0.1:11434
    api_key_env: null
  prompt: |
    You are a task-complexity classifier for an LLM router.

    Classify the computational and reasoning effort required
    to complete the user's task.

    Return ONLY one digit: 1, 2, or 3.

    LEVEL 1 — SIMPLE
    - Short, mechanical, or self-contained tasks.
    - Simple explanations, summaries, and transformations.
    - Simple shell commands and Git operations.
    - Small, localized edits with clear requirements.

    LEVEL 2 — MODERATE
    - Standard coding and debugging tasks.
    - Code analysis and explanations.
    - Implementations with a limited, well-defined scope.
    - Tasks requiring several reasoning or implementation steps.

    LEVEL 3 — COMPLEX
    - Repository-wide analysis and code review.
    - Architecture design and significant refactoring.
    - Broad implementations affecting multiple components.
    - Tasks requiring substantial planning or coordination.
    - Complex debugging involving multiple interacting systems.

    CLASSIFICATION RULES
    1. Classify the work required, not the length of the message.
    2. Missing context or ambiguity does not imply high complexity.
    3. Short continuation messages are not new tasks.
    4. If a previous task classification is provided and the user
      is continuing that task, preserve the previous level.
    5. If the user significantly changes the scope, classify the
      new task instead.
    6. When context is unavailable, do not assume that the task
      requires complex work.
    7. When two levels apply, select the lower level unless the
      task explicitly requires capabilities from the higher level.

    EXAMPLES
    "Explain git rebase" → 1
    "Continue" (previous level: 1) → 1
    "Continue" (previous level: 3) → 3
    "Fix a typo in README" → 1
    "Implement a REST endpoint" → 2
    "Debug authentication across multiple services" → 3
    "Review the entire repository" → 3
    "Design a new authentication architecture" → 3

    Return ONLY the classification digit.

    Task:
    {task}

  output:
    simple: "1"
    medium: "2"
    complex: "3"
  timeout_ms: 1500
  max_output_tokens: 4
  temperature: 0
  cache_size: 500
  extraction:
    task_head_chars: 700
    task_tail_chars: 300
    system_prefix_chars: 200
  heuristic:
    simple_max_chars: 400
    system_max_chars: 400
    allow_simple_in_agentic: false

models:
  simple:
    provider: litellm
    model: ${SIMPLE_MODEL}
    api_base: ${SIMPLE_BASE_URL}
    api_key_env: SIMPLE_API_KEY

  medium:
    provider: litellm
    model: ${MEDIUM_MODEL}
    api_base: ${MEDIUM_BASE_URL}
    api_key_env: MEDIUM_API_KEY

  complex:
    provider: anthropic_subscription
    model: passthrough
    api_base: https://api.anthropic.com
    api_key_env: null

escalation:
  enabled: true
  provider_failure:
    simple_to_medium: true
    medium_to_complex: true
  semantic:
    enabled: false
    max_attempts_per_level: 1
  never_demote_within_task: true
  chain:
    simple: [medium, complex]
    medium: [complex]
    complex: []

timeouts:
  classifier_ms: 1500
  connect_ms: 5000
  request_ms:
    simple: 120000
    medium: 300000
    complex: 600000
  stream_idle_ms:
    simple: 60000
    medium: 120000
    complex: 120000

telemetry:
  enabled: true
  persist_prompts: false
  preserve_claude_default: true

doctor:
  live_probes: false
  probe_timeout_ms: 10000
  check_streaming: true
  check_tool_calls: true

debug:
  classification_endpoint: true
  capture_bodies: false

logging:
  level: INFO
